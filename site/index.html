<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Place Finder</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
    input, button { font: inherit; padding: .5rem; }
    #result { margin-top: 1rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Place Finder</h1>
  <p>Type an address and get its coordinates.</p>
  <input id="address" value="Lagos, Nigeria" aria-label="Address">
  <button id="go">Find</button>
  <div id="result"></div>

  <script>
    // DEMO ONLY: these two lines are deliberate security flaws.
    // The scanner in this repo must detect them and block deployment.
    const API_KEY = "AIzaSyDEMO-NotARealKey-0000000000000000";
    const BACKEND_TOKEN = "q8Zr3LmV0xT9bNc2Wd7Yp5Hs";

    document.getElementById("go").addEventListener("click", async () => {
      const address = document.getElementById("address").value;
      const url = "https://maps.googleapis.com/maps/api/geocode/json?address=" +
        encodeURIComponent(address) + "&key=" + API_KEY;
      const out = document.getElementById("result");
      try {
        const res = await fetch(url, { headers: { "X-Backend-Auth": BACKEND_TOKEN } });
        const data = await res.json();
        out.textContent = JSON.stringify(data.results && data.results[0] ? data.results[0].geometry.location : data, null, 2);
      } catch (err) {
        out.textContent = "Request failed: " + err.message;
      }
    });
  </script>
</body>
</html>
